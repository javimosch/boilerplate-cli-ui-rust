[package]
name = "boilerplate-cli-ui-rust"
version = "1.0.0"
edition = "2021"
description = "Rust CLI with embedded web UI - part of SuperCLI ecosystem"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
