name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: ./build.sh

      - name: Smoke test
        run: ./target/release/boilerplate-cli-ui-rust version

      - name: Report binary size
        run: |
          set -e
          BIN=$(echo "./target/release/boilerplate-cli-ui-rust version" | awk '{print $1}')
          echo "binary=$BIN size=$(stat -c%s "$BIN") bytes"
